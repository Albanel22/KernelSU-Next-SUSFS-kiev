name: Build ReSukiSU SUSFS Manual Hook kiev

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout build script
        uses: actions/checkout@v4

      - name: Run complete ReSukiSU + SUSFS build
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: |
          set -euxo pipefail
          bash scripts/build.sh

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resukisu-susfs-manual-hook-kiev-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            output/ReSukiSU-SuSFS-boot.img
            output/dtbo.img
            output/build.log
            output/ksud
            kernel_sources/out/arch/arm64/boot/Image
